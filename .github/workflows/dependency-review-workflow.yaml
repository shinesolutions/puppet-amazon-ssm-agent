---
name: Dependency Review
'on':
  pull_request:
permissions:
  contents: read
jobs:
  dependency-review:
    # Fail a pull request that adds a dependency with a known vulnerability
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
