---
HOSTS:
  amazon-2023-x86_64:
    roles:
      - default
    # Must match the image's OS: beaker uses it to pick the OpenVox repo, and
    # el-10 packages need GLIBC_2.38 while Amazon Linux 2023 ships glibc 2.34
    platform: amazon-2023-x86_64
    image: amazonlinux:2023
    hypervisor: docker
    # Keep the built image so these layers are cached between runs. The agent is
    # baked in, so beaker doesn't install it (BEAKER_PUPPET_COLLECTION is
    # preinstalled in the Makefile).
    docker_preserve_image: true
    docker_image_commands:
      # amazonlinux:2023 ships without systemd, so /sbin/init has to be
      # installed
      - dnf install -y systemd
      # The release package URL can't be wrapped
      # yamllint disable-line rule:line-length
      - dnf install -y https://ftp.gwdg.de/pub/linux/openvox/yum/openvox9-release-amazon-2023.noarch.rpm
      # The release package's repo file points at yum.voxpupuli.org, which
      # is down, so switch its baseurl to the mirror (the GPG key is in the
      # release package)
      # yamllint disable-line rule:line-length
      - sed -i 's|https://yum.voxpupuli.org/|https://ftp.gwdg.de/pub/linux/openvox/yum/|' /etc/yum.repos.d/openvox9-release.repo
      - dnf install -y openvox-agent
    docker_cmd: '["/sbin/init"]'
    image_outer_ports:
      - 22
CONFIG:
  type: aio
